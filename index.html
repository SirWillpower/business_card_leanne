<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="description" content="Leanne Bell, MBA — Brand Manager at Canadian Blood Services. Let's keep in touch.">

    <!-- Open Graph -->
    <meta property="og:title" content="Leanne Bell, MBA">
    <meta property="og:description" content="Brand Manager at Canadian Blood Services — Let's keep in touch.">
    <meta property="og:image" content="https://leannebell.ca/static/leanne_portrait.jpg">
    <meta property="og:url" content="https://leannebell.ca">
    <meta property="og:type" content="profile">

    <title>Leanne Bell, MBA</title>
    <link rel="stylesheet" href="static/styles.css">
    <link rel="stylesheet" href="https://use.typekit.net/rfl3gjd.css">
    <link rel="icon" type="image/x-icon" href="static/favicon_leanne.png">
</head>
<body>
    <div class="banner">
        <div class="content">
            <img src="static/leanne_portrait.jpg" alt="Portrait" class="portrait">
            <h1>I'm Leanne</h1>
            <h2>Let's keep in touch!</h2>
            <p class="description">Brand Manager at Canadian Blood Services</p>
            <button id="vcf-btn" class="button" onclick="handleContact()">Download Contact</button>
            <div class="social-buttons">
                <a href="tel:+16138588446" class="social-btn phone">
                    <img src="static/icons/phone.png" alt="Phone">
                </a>
                <a href="https://www.linkedin.com/in/leanne-bell/" target="_blank" rel="noopener noreferrer" class="social-btn linkedin">
                    <img src="static/icons/linkedin.png" alt="LinkedIn">
                </a>
                <a href="mailto:leanne.bell@blood.ca?body=Hello%20Leanne%2C%0A%0ALet%27s%20keep%20in%20touch%21%0A%0A" class="social-btn email">
                    <img src="static/icons/email.png" alt="Email">
                </a>
            </div>
        </div>
    </div>

    <script>
        function handleContact() {
            const ua = navigator.userAgent;
            const isAndroid = /android/i.test(ua);

            if (isAndroid) {
                window.location.href = "intent://leannebell.ca/static/bell.vcf#Intent;scheme=https;type=text/x-vcard;action=android.intent.action.VIEW;end";
            } else {
                const a = document.createElement('a');
                a.href = 'static/bell.vcf';
                a.download = 'bell.vcf';
                a.click();
            }
        }
    </script>
</body>
</html>
